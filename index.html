<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UPI Reconciliation Dashboard</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <header>
    <h1>UPI Transaction Reconciliation Dashboard</h1>
  </header>

  <main>

    <!-- Upload section -->
    <section class="card">
      <h2>Upload new files</h2>
      <form id="upload-form">
        <label>
          Merchant transactions CSV
          <input type="file" id="merchant-file" accept=".csv" required />
        </label>
        <label>
          NPCI settlement CSV
          <input type="file" id="settlement-file" accept=".csv" required />
        </label>
        <button type="submit">Run reconciliation</button>
      </form>
      <p id="upload-status"></p>
    </section>

    <!-- Summary cards -->
    <section class="card">
      <h2>Summary</h2>
      <div id="summary-cards" class="summary-grid"></div>
    </section>

    <!-- Table -->
    <section class="card">
      <h2>All transactions</h2>

      <div class="table-controls">
        <label>
          Filter by status:
          <select id="status-filter">
            <option value="ALL">All</option>
          </select>
        </label>
        <button id="download-btn">Download CSV</button>
      </div>

      <div class="table-wrapper">
        <table id="results-table">
          <thead>
            <tr>
              <th>Transaction ID</th>
              <th>Matched RRN</th>
              <th>Merchant Amount</th>
              <th>Settled Amount</th>
              <th>Status</th>
              <th>Notes</th>
            </tr>
          </thead>
          <tbody id="results-body">
            <!-- filled in by script.js -->
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script src="/static/script.js"></script>
</body>
</html>
